name: KAICODE APK Builder

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "KAICODE Build ID"
        required: true
        type: string
      project_code:
        description: "Generated Kotlin code (Base64 or plain Kotlin)"
        required: true
        type: string
      language:
        description: "Language"
        required: true
        type: string
      technology:
        description: "Technology"
        required: true
        type: string

run-name: KAICODE-${{ inputs.build_id }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Create Android project
        env:
          PROJECT_CODE: ${{ inputs.project_code }}
        run: |
          mkdir -p app/src/main/java/com/kairobuilds/generatedapp
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KAICODEGeneratedApp"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.kairobuilds.generatedapp'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.kairobuilds.generatedapp'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="KAICODE App"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#825AFF</item>
              </style>
          </resources>
          EOF

          python3 - <<'PY'
          import os
          import base64
          import re

          raw = os.environ["PROJECT_CODE"].strip()

          if "```" in raw:
              match = re.search(
                  r"```(?:kotlin|kt)?\s*([\s\S]*?)```",
                  raw,
                  re.IGNORECASE
              )
              if match:
                  raw = match.group(1).strip()

          kotlin_markers = (
              "package ",
              "import ",
              "class ",
              "object ",
              "fun ",
              "@file:",
              "private class ",
              "public class "
          )

          if raw.startswith(kotlin_markers):
              code = raw
          else:
              try:
                  decoded = base64.b64decode(
                      raw,
                      validate=True
                  ).decode("utf-8").strip()

                  if decoded.startswith(kotlin_markers):
                      code = decoded
                  else:
                      code = raw
              except Exception:
                  code = raw

          with open(
              "app/src/main/java/com/kairobuilds/generatedapp/MainActivity.kt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(code)
          PY

      - name: Verify Kotlin source
        run: |
          echo "===== MainActivity.kt ====="
          sed -n '1,80p' app/src/main/java/com/kairobuilds/generatedapp/MainActivity.kt
          echo "=========================="

      - name: Create Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9

      - name: Build APK
        run: |
          ./gradlew clean assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "kaicode-${{ inputs.build_id }}" \
            "app/build/outputs/apk/debug/app-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "KAICODE APK ${{ inputs.build_id }}" \
            --notes "APK generated by KAICODE." \
            --prerelease

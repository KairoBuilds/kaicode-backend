name: KAICODE APK Builder

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "KAICODE Build ID"
        required: true
        type: string

      project_code:
        description: "Generated Kotlin code (Base64 or plain Kotlin)"
        required: true
        type: string

      language:
        description: "Language"
        required: true
        type: string

      technology:
        description: "Technology"
        required: true
        type: string

run-name: KAICODE-${{ inputs.build_id }}

permissions:
  contents: write

jobs:
  build:
    name: Build KAICODE APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Java
      # --------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 3. Setup Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # --------------------------------------------------
      # 4. Setup Gradle
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      # --------------------------------------------------
      # 5. Create Android project
      # --------------------------------------------------
      - name: Create Android project
        env:
          PROJECT_CODE: ${{ inputs.project_code }}
        shell: bash
        run: |

          set -e

          echo "Creating KAICODE Android project..."

          mkdir -p app/src/main/java/com/kairobuilds/generatedapp
          mkdir -p app/src/main/res/values

          # ------------------------------------------------
          # settings.gradle
          # ------------------------------------------------

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KAICODEGeneratedApp"

          include(":app")
          EOF

          # ------------------------------------------------
          # Root build.gradle
          # ------------------------------------------------

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          # ------------------------------------------------
          # gradle.properties
          # ------------------------------------------------

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # ------------------------------------------------
          # app/build.gradle
          # ------------------------------------------------

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.kairobuilds.generatedapp'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.kairobuilds.generatedapp'

                  minSdk 23
                  targetSdk 35

                  versionCode 1
                  versionName '1.0'
              }

              buildFeatures {
                  buildConfig true
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
          }
          EOF

          # ------------------------------------------------
          # AndroidManifest.xml
          # ------------------------------------------------

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="KAICODE App"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # ------------------------------------------------
          # styles.xml
          # ------------------------------------------------

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#825AFF</item>
                  <item name="android:navigationBarColor">#07080E</item>
                  <item name="android:statusBarColor">#07080E</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          # ------------------------------------------------
          # Decode / clean generated Kotlin code
          # ------------------------------------------------

          python3 - <<'PY'
          import os
          import base64
          import re
          import sys

          raw = os.environ.get("PROJECT_CODE", "").strip()

          if not raw:
              print("ERROR: PROJECT_CODE is empty.")
              sys.exit(1)

          print("Received project code.")

          match = re.search(
              r"```(?:kotlin|kt)?\s*([\s\S]*?)```",
              raw,
              re.IGNORECASE
          )

          if match:
              raw = match.group(1).strip()

          raw = raw.strip()

          kotlin_markers = (
              "package ",
              "import ",
              "class ",
              "object ",
              "fun ",
              "@file:",
              "private class ",
              "public class ",
              "internal class "
          )

          if raw.startswith(kotlin_markers):
              code = raw
              print("Detected plain Kotlin code.")

          else:
              try:
                  compact = "".join(raw.split())

                  decoded = base64.b64decode(
                      compact,
                      validate=True
                  ).decode("utf-8").strip()

                  if decoded.startswith(kotlin_markers):
                      code = decoded
                      print("Detected Base64 encoded Kotlin.")
                  else:
                      code = raw
                      print("Base64 decoded text was not Kotlin. Using original input.")

              except Exception:
                  code = raw
                  print("Input was not valid Base64. Using original input.")

          if not code.strip():
              print("ERROR: Kotlin source is empty.")
              sys.exit(1)

          if "class MainActivity" not in code:
              print("WARNING: MainActivity was not found.")
              print("The generated code must contain MainActivity.")

          output_file = (
              "app/src/main/java/"
              "com/kairobuilds/generatedapp/"
              "MainActivity.kt"
          )

          with open(
              output_file,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(code)

          print("")
          print("Kotlin source saved successfully.")
          print("File:", output_file)
          print("Characters:", len(code))

          PY

      # --------------------------------------------------
      # 6. Show generated Kotlin
      # --------------------------------------------------
      - name: Verify Kotlin source
        run: |

          echo "======================================"
          echo "KAICODE GENERATED MAINACTIVITY"
          echo "======================================"

          test -f app/src/main/java/com/kairobuilds/generatedapp/MainActivity.kt

          sed -n '1,160p' \
            app/src/main/java/com/kairobuilds/generatedapp/MainActivity.kt

          echo "======================================"

      # --------------------------------------------------
      # 7. Create Gradle wrapper
      # --------------------------------------------------
      - name: Create Gradle wrapper
        run: |

          gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

      # --------------------------------------------------
      # 8. Make Gradle wrapper executable
      # --------------------------------------------------
      - name: Prepare Gradle wrapper
        run: |

          chmod +x ./gradlew

          ./gradlew --version

      # --------------------------------------------------
      # 9. Clean project
      # --------------------------------------------------
      - name: Clean project
        run: |

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # --------------------------------------------------
      # 10. Build Debug APK
      # --------------------------------------------------
      - name: Build APK
        run: |

          set +e

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "======================================"
          echo "KAICODE COMPILER ERRORS"
          echo "======================================"

          grep -E "^(e:|.*error:|.*ERROR:)" build.log || true

          echo "======================================"

          exit $BUILD_EXIT

      # --------------------------------------------------
      # 11. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        run: |

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
              echo "ERROR: APK was not created."
              exit 1
          fi

          echo ""
          echo "======================================"
          echo "KAICODE APK CREATED"
          echo "======================================"

          ls -lh "$APK"

          echo "======================================"

      # --------------------------------------------------
      # 12. Upload APK as GitHub Artifact
      # --------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAICODE-${{ inputs.build_id }}-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # --------------------------------------------------
      # 13. Create GitHub Release
      # --------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          gh release create \
            "kaicode-${{ inputs.build_id }}" \
            "app/build/outputs/apk/debug/app-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "KAICODE APK ${{ inputs.build_id }}" \
            --notes "APK generated automatically by KAICODE." \
            --prerelease
